<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroSim — Black Hole &amp; Star Simulator</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23000' stroke='%23ffb347' stroke-width='2'/></svg>" />
</head>
<body>

  <!-- ================= APP CHROME ================= -->
  <div id="app">

    <!-- ---------- MENU BAR ---------- -->
    <nav id="menubar" class="menubar"></nav>

    <!-- ---------- WORKSPACE ---------- -->
    <main id="workspace">

      <!-- Left : object inspector -->
      <aside id="left-panel" class="side-panel">
        <header class="panel-title">
          <span>Objects</span>
          <button id="btn-add-object" class="mini-btn" title="Spawn new object">+</button>
        </header>
        <div id="object-list" class="object-list"></div>
      </aside>

      <!-- Center : canvas -->
      <section id="viewport">
        <canvas id="stage"></canvas>
        <div id="hud" class="hud"></div>
        <div id="toast" class="toast"></div>
      </section>

      <!-- Right : inspector + tools -->
      <aside id="right-panel" class="side-panel">
        <header class="panel-title"><span>Inspector</span></header>
        <div id="inspector" class="inspector"></div>
      </aside>
    </main>

    <!-- ---------- BOTTOM CONTROL BAR ---------- -->
    <footer id="controlbar" class="controlbar"></footer>
  </div>

  <!-- ================= MODAL PAGES ================= -->
  <div id="page-host" class="page-host" aria-hidden="true">
    <div class="page-backdrop" data-close-page></div>
    <div id="page-content" class="page-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ================= SCRIPTS (order matters) ================= -->
  <!-- Full-stack build (TypeScript client) lives in client/ — see README.md -->
  <script src="js/lib/mathx.js"></script>
  <script src="js/lib/calculus.js"></script>
  <script src="js/lib/linalg.js"></script>
  <script src="js/lib/rkmethods.js"></script>

  <script src="js/sim/constants.js"></script>
  <script src="js/sim/body.js"></script>
  <script src="js/sim/star.js"></script>
  <script src="js/sim/blackhole.js"></script>
  <script src="js/sim/relativity.js"></script>
  <script src="js/sim/photonsphere.js"></script>
  <script src="js/sim/gravity.js"></script>
  <script src="js/sim/collision.js"></script>
  <script src="js/sim/presets.js"></script>
  <script src="js/sim/engine.js"></script>

  <script src="js/render/renderer.js"></script>

  <script src="js/ui/pages.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/panel.js"></script>
  <script src="js/ui/controls.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
